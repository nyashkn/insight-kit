[project]
name = "insight-kit"
version = "0.1.6"
description = "Provenance-first agent insights kit — Run + Claim + DAG primitives for traceable analyst/critic loops."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "KN", email = "nyashkn@gmail.com" }]
keywords = ["provenance", "claims", "agents", "lineage", "duckdb", "hamilton", "evidence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "structlog>=25.0",
    "pyarrow>=15",
    "duckdb>=1.5",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
hamilton = ["sf-hamilton[visualization,caching]>=1.83"]
polars = ["polars>=1.40"]
pandas = ["pandas>=2.2"]
evidence = ["jinja2>=3.1"]
signet = []
observability = ["lmnr>=0.7.51"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.7", "mypy>=1.10"]

[project.scripts]
ik = "insight_kit.surfaces.cli.__main__:main"

[project.urls]
Homepage = "https://github.com/nyashkn/insight-kit"
Issues = "https://github.com/nyashkn/insight-kit/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insight_kit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# test identifiers are deliberately invariant-tagged (TestV1_...) and mirror
# SPEC-mandated camelCase symbols (test_finalizeRun_*) — PEP8 naming N-rules
# do not apply to test class/function names.
"tests/**" = ["N801", "N802"]

# T19 — V5 purity: gate modules must import neither hamilton nor pi.
# Defense-in-depth (primary enforcement = AST scan in tests/platform/gate/test_purity.py).
# Scoped to src/insight_kit/platform/gate/** only to avoid blocking hamilton/ adapter code.
[tool.ruff.lint.extend-per-file-ignores]
# No ignores here — keep section as anchor for future per-file rules.

[tool.ruff.lint.flake8-tidy-imports]
# Banned imports — gate-wide protection (V5, C1).
# Applied via ruff check on src/insight_kit/platform/gate/; harmless on other modules
# since hamilton IS used there (adapter.py). The per-file restriction means we
# rely on path-scoped CI runs (uv run ruff check src/insight_kit/platform/gate/) for V5.
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not slow and not eval and not network'"
markers = [
    "slow: integration tests run separately (opt-in via -m slow)",
    "eval: probabilistic/quality gates, not pass/fail (opt-in via -m eval)",
    "network: tests that make real network calls (opt-in via -m network)",
]
