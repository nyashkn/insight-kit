[project]
name = "insight-kit"
version = "0.1.0a1"
description = "Provenance-first agent insights kit — Run + Claim + DAG primitives for traceable analyst/critic loops."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "KN", email = "nyashkn@gmail.com" }]
keywords = ["provenance", "claims", "agents", "lineage", "duckdb", "hamilton", "evidence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "structlog>=25.0",
    "pyarrow>=15",
    "duckdb>=1.5",
]

[project.optional-dependencies]
hamilton = ["sf-hamilton[visualization,caching]>=1.83"]
polars = ["polars>=1.40"]
pandas = ["pandas>=2.2"]
evidence = ["jinja2>=3.1"]
signet = []
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.7", "mypy>=1.10"]

[project.scripts]
ik = "insight_kit.cli.__main__:main"

[project.urls]
Homepage = "https://github.com/nyashkn/insight-kit"
Issues = "https://github.com/nyashkn/insight-kit/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insight_kit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not slow and not eval'"
markers = [
    "slow: integration tests run separately (opt-in via -m slow)",
    "eval: probabilistic/quality gates, not pass/fail (opt-in via -m eval)",
]
